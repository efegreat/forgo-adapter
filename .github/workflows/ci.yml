name: CI

on:
  push:
    branches: [main]
    # v* releases the root module, otel/v* the nested OpenTelemetry module.
    tags: ["v*", "otel/v*"]
  pull_request:
  # Weekly, so that a vulnerability found since the last push fails the build.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The integration tests run against these services. Without their URLs they skip.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: forgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: forgo
          MYSQL_DATABASE: forgo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pforgo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      rabbitmq:
        image: rabbitmq:4
        env:
          # guest may only connect from localhost, and the tests reach the container through a port.
          RABBITMQ_DEFAULT_USER: forgo
          RABBITMQ_DEFAULT_PASS: forgo
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      # The newest Redis, and the oldest the Redis Streams broker supports.
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis-min:
        image: redis:6.2
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ADAPTER_TEST_POSTGRES_DSN: postgres://postgres:forgo@127.0.0.1:5432/postgres?sslmode=disable
      ADAPTER_TEST_MYSQL_DSN: root:forgo@tcp(127.0.0.1:3306)/forgo
      ADAPTER_TEST_RABBITMQ_URL: amqp://forgo:forgo@127.0.0.1:5672/
      ADAPTER_TEST_REDIS_ADDRS: 127.0.0.1:6379,127.0.0.1:6380
    defaults:
      run:
        working-directory: forgo-adapter
    steps:
      - uses: actions/checkout@v7
        with:
          path: forgo-adapter
          persist-credentials: false

      # Until forgo is released, go.mod replaces it with a checkout next to this one.
      - name: Check for a local forgo
        id: forgo
        run: |
          if grep -q '=> ../forgo$' go.mod; then
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out forgo
        if: steps.forgo.outputs.local == 'true'
        uses: actions/checkout@v7
        with:
          repository: efegreat/forgo
          path: forgo
          # Reading a private forgo needs a FORGO_TOKEN secret with read access to it.
          token: ${{ secrets.FORGO_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: forgo-adapter/go.mod
          cache-dependency-path: forgo-adapter/go.sum
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Reports only the vulnerabilities that the adapters' code can reach, in the Go release
      # setup-go installed and in the required modules.
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  # The nested OpenTelemetry module, which has a go.mod of its own and needs none of the services.
  otel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgo-adapter/otel
    steps:
      - uses: actions/checkout@v7
        with:
          path: forgo-adapter
          persist-credentials: false

      # Until forgo is released, go.mod replaces it with a checkout next to forgo-adapter.
      - name: Check for a local forgo
        id: forgo
        run: |
          if grep -q '=> ../../forgo$' go.mod; then
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out forgo
        if: steps.forgo.outputs.local == 'true'
        uses: actions/checkout@v7
        with:
          repository: efegreat/forgo
          path: forgo
          token: ${{ secrets.FORGO_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: forgo-adapter/otel/go.mod
          cache-dependency-path: forgo-adapter/otel/go.sum
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  # Pushing a v* tag releases it once every check passes on the tagged commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Modules that depend on this one ignore its replace directives, so a release that replaces
      # forgo would not build for them.
      - name: Check that go.mod requires a released forgo
        run: |
          if grep -q '=> ../forgo$' go.mod; then
            echo "go.mod replaces forgo with ../forgo. Require a released forgo version before tagging."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease

      # pkg.go.dev lists a version once the module proxy has fetched it, and the proxy fetches it
      # only when someone asks for it. It fetches public modules only.
      - name: Publish the version to the Go module proxy
        if: ${{ !github.event.repository.private }}
        run: curl -fsS "https://proxy.golang.org/github.com/efegreat/forgo-adapter/@v/$TAG.info"

  # Pushing an otel/v* tag releases the nested OpenTelemetry module, as version v* of
  # github.com/efegreat/forgo-adapter/otel.
  release-otel:
    if: startsWith(github.ref, 'refs/tags/otel/v')
    needs: [otel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that go.mod requires a released forgo
        run: |
          if grep -q '=> ../../forgo$' otel/go.mod; then
            echo "otel/go.mod replaces forgo with ../../forgo. Require a released forgo version before tagging."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease

      - name: Publish the version to the Go module proxy
        if: ${{ !github.event.repository.private }}
        run: curl -fsS "https://proxy.golang.org/github.com/efegreat/forgo-adapter/otel/@v/${TAG#otel/}.info"
