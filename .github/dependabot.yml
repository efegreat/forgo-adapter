version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        update-types: [minor, patch]

  # The nested OpenTelemetry module has a go.mod of its own.
  - package-ecosystem: gomod
    directory: /otel
    schedule:
      interval: weekly
    groups:
      otel-modules:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
