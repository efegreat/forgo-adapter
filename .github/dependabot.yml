version: 2
updates:
  # Every module has a go.mod of its own.
  - package-ecosystem: gomod
    directories: ["/", "/otel", "/pubsub", "/rabbitmq", "/redis"]
    schedule:
      interval: weekly
    groups:
      go-modules:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
